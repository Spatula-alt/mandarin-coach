<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mandarin Coach</title>
<meta name="description" content="Learn Mandarin in 90-minute sessions: flashcards with recorded audio, a tone trainer and speaking practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: one calm column, phone first. Flashcards sit in a 田字格 practice square; tone colours are the only loud colour. */
:root {
  --bg: #eef1ea; --surface: #fafbf7; --sunk: #e3e8df; --ink: #1c231f; --muted: #5b675f; --line: #cfd7cc;
  --accent: #2b3a67; --accent-soft: #dfe4f2; --on-accent: #ffffff;
  --good: #2f7a46; --warn: #a8620b; --bad: #b23a2b;
  --t1: #c73e2e; --t2: #b8730f; --t3: #2f8a4c; --t4: #7347c2; --t5: #7d8781; --grid: #c9a9a2;
  --font-display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  --radius: 12px; --pad: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1a1f1c; --sunk: #232a26; --ink: #e6ebe5; --muted: #9aa69e; --line: #2f3833;
    --accent: #a9b8f0; --accent-soft: #283152; --on-accent: #10131f; --good: #5cc07a; --warn: #e9a648; --bad: #f0745f;
    --t1: #f0715f; --t2: #eaa646; --t3: #5cc57b; --t4: #ae90ee; --t5: #98a29c; --grid: #6b4a45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1f1c; --sunk: #232a26; --ink: #e6ebe5; --muted: #9aa69e; --line: #2f3833;
  --accent: #a9b8f0; --accent-soft: #283152; --on-accent: #10131f; --good: #5cc07a; --warn: #e9a648; --bad: #f0745f;
  --t1: #f0715f; --t2: #eaa646; --t3: #5cc57b; --t4: #ae90ee; --t5: #98a29c; --grid: #6b4a45;
  color-scheme: dark;
}
@media (min-width: 640px) { :root { --pad: 20px; } }

/* Base: no sideways scrolling, no double-tap zoom, and 16px form text so iPhone doesn't zoom on tap */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; overflow-x: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
svg, img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.han { font-family: var(--font-han); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.label { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.view, .view > *, .panel > *, .card-stage > *, .trainer > * { min-width: 0; }

/* Header, tabs, toast */
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { padding-block: 14px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand > div { min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; display: grid; place-items: center; font-family: var(--font-han); font-size: 24px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 10px; }
.brand h1 { font-size: 1.25rem; white-space: nowrap; }
#top-status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 6px; flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: min(92vw, 460px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .92rem; text-align: center; box-shadow: 0 6px 24px rgb(0 0 0 / .25); }
@media (min-width: 641px) { .toast { bottom: 24px; } }
#install-tip .note { margin-bottom: 10px; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; overflow-x: auto; scrollbar-width: none; }
.tab { flex: 1 0 auto; border: 0; background: none; padding: 9px 10px 8px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
.tab .han { font-size: 1.05rem; line-height: 1.2; }
.tab span:last-child { font-size: .74rem; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 640px) {
  .tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs .wrap { padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
  .tab { flex: 1 1 0; min-width: 0; padding: 7px 0 6px; border-bottom: 0; border-top: 3px solid transparent; }
  .tab[aria-selected="true"] { border-top-color: var(--accent); }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .top-actions .btn { padding: 6px 10px; }
}
main { padding-block: 12px 40px; }
.view { display: grid; gap: 14px; }

/* Panels and building blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); display: grid; gap: 14px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.split { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--sunk); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .92rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--sunk); font-size: .8rem; font-weight: 600; white-space: nowrap; }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.field { display: grid; gap: 4px; min-width: 0; }
input[type="text"], input[type="password"], input[type="number"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.big { padding: 13px 22px; font-size: 1.05rem; }
.btn.wide { width: 100%; max-width: 420px; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.play { color: var(--accent); }
.speak { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--accent); min-width: 40px; min-height: 40px; display: inline-grid; place-items: center; }
.speak:hover { background: var(--sunk); }

/* Segmented controls (syllables, speed) */
.seg-group { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.seg { border: 0; background: none; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer; min-height: 36px; flex: 1 1 auto; white-space: nowrap; }
.seg[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
.speed { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.view > .speed { justify-content: flex-end; }
@media (max-width: 420px) { .speed .seg { padding: 7px 9px; font-size: .85rem; } }

/* Tone colours */
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; font-weight: 600; }

/* Today and the session runner */
.today-hero { gap: 14px; }
.today-hero h2 { font-size: 1.9rem; }
.today-actions { display: grid; gap: 8px; }
@media (min-width: 560px) { .today-actions { display: flex; flex-wrap: wrap; } }
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.block { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--sunk); }
.block .when { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .82rem; }
.block.done { opacity: .5; }
.block.now { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
@media (max-width: 420px) { .block { grid-template-columns: 62px 1fr; } .block > :last-child { display: none; } }
.runner h2 { font-size: 1.5rem; }
.timer-row { display: grid; justify-items: center; gap: 2px; }
.timer { font-family: var(--font-display); font-size: clamp(3rem, 16vw, 4.5rem); font-variant-numeric: tabular-nums; line-height: 1; }
.timer.over { color: var(--warn); }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.runner-btns { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.runner .speed { justify-content: center; }
.linkcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.linkcard { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); }
.linkcard:hover { border-color: var(--accent); }
.linkcard b { color: var(--accent); }

/* Flashcards in a 田字格 square */
.card-stage { display: grid; justify-items: center; gap: 12px; text-align: center; }
.tzg { position: relative; width: min(100%, 260px); aspect-ratio: 1; border: 2px solid var(--grid); border-radius: 4px; background: var(--surface); display: grid; place-items: center; }
.tzg::before, .tzg::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.tzg::before { background: linear-gradient(var(--grid), var(--grid)) center / 100% 1px no-repeat, linear-gradient(var(--grid), var(--grid)) center / 1px 100% no-repeat; opacity: .55; }
.tzg::after { background: linear-gradient(to top right, transparent calc(50% - .5px), var(--grid) 50%, transparent calc(50% + .5px)), linear-gradient(to top left, transparent calc(50% - .5px), var(--grid) 50%, transparent calc(50% + .5px)); opacity: .3; }
.tzg .word { position: relative; z-index: 1; font-family: var(--font-han); font-weight: 700; line-height: 1.05; padding: 8px; overflow-wrap: anywhere; }
.pinyin { font-size: 1.5rem; font-weight: 600; }
.meaning { font-size: 1.12rem; max-width: 36ch; }
.answer { display: grid; gap: 6px; justify-items: center; }
.card-nav { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 8px; width: 100%; max-width: 420px; }
.card-nav .btn { white-space: nowrap; }
.card-nav.two { grid-template-columns: 1fr 1fr; }
.card-nav .btn { padding-inline: 8px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 420px; }
.grades .btn { padding: 8px 2px; display: grid; gap: 0; line-height: 1.2; }
.grades .btn small { font-weight: 400; color: var(--muted); font-size: .74rem; }
.grades .btn.again { border-color: var(--bad); }
@media (hover: none) { .keys-hint { display: none; } }

/* Ear trainer */
.trainer { display: grid; justify-items: center; gap: 22px; padding-top: 8px; }
.trainer .choices:empty { display: none; }
.play-big { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 14px 26px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 1.05rem; cursor: pointer; min-height: 52px; }
.play-big svg { width: 22px; height: 22px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 460px; }
@media (min-width: 640px) { .choices { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 600px; } }
.choice { display: grid; justify-items: center; gap: 2px; padding: 12px 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; min-width: 0; }
.choice:hover { border-color: var(--accent); }
.choice .contour { height: 34px; }
.choice-py { font-size: 1.15rem; font-weight: 700; }
.choice-num { font-size: .78rem; color: var(--muted); }
.choice-en { font-size: .86rem; font-weight: 600; }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.result { width: 100%; max-width: 460px; }
.result-card { display: grid; justify-items: center; gap: 4px; padding: 12px; border-radius: 12px; background: var(--sunk); text-align: center; }
.result-card.is-right .label { color: var(--good); }
.result-card.is-wrong .label { color: var(--bad); }
.result-word { display: flex; align-items: center; gap: 4px; }
.result-hz { font-size: 2.2rem; }
.result-en { font-size: 1.05rem; }

/* Tone pairs */
.pair-row { font-weight: 700; margin-top: 4px; }
.pair-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pair-card { display: grid; justify-items: start; gap: 1px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; min-width: 0; }
.pair-card:hover { border-color: var(--accent); }
.pair-tag { font-size: .74rem; font-weight: 700; color: var(--muted); }
.pair-hz { font-size: 1.6rem; line-height: 1.2; }
.pair-py { font-size: .95rem; font-weight: 600; }
.pair-en { font-size: .82rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pair-note { font-size: .74rem; color: var(--warn); font-weight: 600; }

.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.panel > .btn { justify-self: start; }

/* Shadowing sentences */
.sentences { display: grid; gap: 8px; }
.sentence { display: grid; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--sunk); }
.sentence-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sentence-hz { font-size: 1.35rem; min-width: 0; }
.sentence-btns { display: flex; align-items: center; gap: 2px; flex: none; }
.sentence-py { font-size: .95rem; }

/* Word list */
.wordlist { display: grid; max-height: 70vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
.wl-row { display: grid; grid-template-columns: minmax(56px, auto) minmax(80px, 1fr) 2fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.wl-row:last-child { border-bottom: 0; }
.wl-row .han { font-size: 1.3rem; }
.wl-py { font-size: .95rem; }
@media (max-width: 520px) { .wl-row { grid-template-columns: auto 1fr auto; row-gap: 0; } .wl-row .wl-mean { grid-column: 1 / -1; font-size: .9rem; color: var(--muted); } }

/* Progress */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.milestones { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.milestones li { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; }
@media (max-width: 420px) { .milestones li { grid-template-columns: 1fr auto; } .milestones li > span:not(.chip) { grid-column: 1 / -1; grid-row: 2; font-size: .88rem; color: var(--muted); } }
.strip { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; max-width: 520px; }
.day { display: inline-block; aspect-ratio: 1; min-width: 10px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line); }
.day.some { background: var(--accent-soft); }
.day.full { background: var(--accent); border-color: var(--accent); }
.day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend .day { width: 14px; height: 14px; vertical-align: -2px; }
details.panel > summary { cursor: pointer; font-weight: 600; }

/* Class sharing and the coach view */
.join { border-color: var(--accent); }
.invite { grid-template-columns: 1fr auto; align-items: center; }
@media (max-width: 560px) { .invite { grid-template-columns: 1fr; } }
.invite-text { display: grid; gap: 10px; }
.invite-link { font-family: ui-monospace, Consolas, monospace; font-size: .85rem; background: var(--sunk); padding: 8px 10px; border-radius: 8px; overflow-wrap: anywhere; }
.qr { background: #fff; padding: 10px; border-radius: 10px; justify-self: center; line-height: 0; }
.qr img, .qr canvas { display: block; max-width: 100%; }
.learner { display: grid; gap: 10px; padding-block: 14px; border-top: 1px solid var(--line); }
.learner-name { font-size: 1.1rem; }
.bars { width: 140px; height: 36px; display: block; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
<header class="wrap top">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">学</div>
    <div>
      <h1>Mandarin Coach</h1>
      <p class="muted small" id="top-status">90 minutes, every other day</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn small" type="button" id="btn-install" hidden>Install app</button>
    <button class="btn small" type="button" id="btn-share">Share app</button>
  </div>
</header>
<p class="toast" id="save-state" role="status" hidden></p>
<div class="wrap" id="install-tip" hidden></div>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-today" data-view="today"><span class="han">今天</span><span>Today</span></button>
    <button class="tab" role="tab" id="tab-cards" data-view="cards"><span class="han">卡片</span><span>Cards</span></button>
    <button class="tab" role="tab" id="tab-tones" data-view="tones"><span class="han">声调</span><span>Tones</span></button>
    <button class="tab" role="tab" id="tab-speak" data-view="speak"><span class="han">说话</span><span>Speak</span></button>
    <button class="tab" role="tab" id="tab-words" data-view="words"><span class="han">词语</span><span>Words</span></button>
    <button class="tab" role="tab" id="tab-progress" data-view="progress"><span class="han">进步</span><span>Progress</span></button>
    <button class="tab" role="tab" id="tab-coach" data-view="coach" hidden><span class="han">老师</span><span>Coach</span></button>
  </div>
</nav>
<main class="wrap" id="main">
  <section class="view" id="view-today" hidden></section>
  <section class="view" id="view-cards" hidden></section>
  <section class="view" id="view-tones" hidden></section>
  <section class="view" id="view-speak" hidden></section>

// ---------- saved progress: kept in this browser; a progress file moves it between devices ----------
const LOCAL_KEY = "mandarin-coach-v1";
const blankState = () => ({
  v: 1, updatedAt: 0,
  cards: {},          // wordId -> { due, ivl, ease, reps, lapses, intro, last }
  sessions: [],       // { d, start, min, plan }
  activity: {},       // dayNum -> { rev, add, tone, talk }
  settings: { newPerSession: 12, speed: 1 },
  custom: [],         // your own words: { hz, py, en, added }
  toneStats: {},      // "1-4" -> { n, ok }
});
const Store = {
  state: blankState(),
  read() { try { const s = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); return s && s.v ? s : null; } catch { return null; } },
  adopt(s) { this.state = Object.assign(blankState(), s, { settings: Object.assign(blankState().settings, s.settings) }); addCustomWords(this.state.custom); },
  init() {
    const s = this.read();
    if (s) this.adopt(s);
    try { localStorage.setItem(LOCAL_KEY + "-probe", "1"); localStorage.removeItem(LOCAL_KEY + "-probe"); }
    catch { status("This browser can't save progress. Is it a private window?"); }
  },
  save() {
    this.state.updatedAt = Date.now();
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.state)); } catch { status("Couldn't save. Is this a private window?"); }
  },
  bump(field, n = 1) { const t = dayNum(), a = (this.state.activity[t] ||= {}); a[field] = (a[field] || 0) + n; },
  // Download everything as a file, to copy to another device or keep as a backup.

    if (!o || !o.v || typeof o.cards !== "object") throw new Error("That file isn't a Mandarin Coach progress file.");

    for (const [id, c] of Object.entries(o.cards)) {

      if (!m || (c.last || 0) > (m.last || 0) || ((c.last || 0) === (m.last || 0) && (c.reps || 0) > (m.reps || 0))) { S.cards[id] = c; cards++; }
    }
    const starts = new Set(S.sessions.map((s) => s.start));
    for (const s of o.sessions || []) if (!starts.has(s.start)) S.sessions.push(s);

    for (const c of o.custom || []) if (!have.has(c.hz + "|" + c.py)) S.custom.push(c);
    addCustomWords(S.custom);

// A short message that floats above the tab bar for a few seconds.

// ---------- spaced repetition (day-based, SM-2 style) ----------
const GRADES = [
  { key: "again", label: "Again", hint: "forgot" },
  { key: "hard", label: "Hard", hint: "" },
  { key: "good", label: "Good", hint: "" },
  { key: "easy", label: "Easy", hint: "" },

function nextInterval(card, g) {

  if (c.reps === 0) return [0, 1, 1, 3][g];

// Returns what undoGrade needs to put the card back exactly as it was.
function gradeCard(id, g) {
  const S = Store.state, today = dayNum(), prev = S.cards[id] ? { ...S.cards[id] } : null;
  const c = S.cards[id] || { ivl: 0, ease: 2.5, reps: 0, lapses: 0, intro: today };

  if (g === 0) { c.lapses++; c.reps = 0; c.ivl = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = today; }

const ivlLabel = (d) => (d === 0 ? "now" : d === 1 ? "1 day" : d < 30 ? d + " days" : Math.round(d / 30) + " mo");
const learned = () => WORDS.filter((w) => Store.state.cards[w.id]);
const known = () => WORDS.filter((w) => (Store.state.cards[w.id]?.ivl || 0) >= 21);
const dueCards = () => { const t = dayNum(); return WORDS.filter((w) => { const c = Store.state.cards[w.id]; return c && c.due <= t; }).sort((a, b) => Store.state.cards[a.id].due - Store.state.cards[b.id].due); };

const newCards = (n) => WORDS.filter((w) => !Store.state.cards[w.id]).sort((a, b) => (a.custom === b.custom ? a.order - b.order : a.custom ? -1 : 1)).slice(0, n);

// ---------- flashcards ----------
function wordFace(w, size) {
  const n = [...w.hz].length;
  const fs = size || (n === 1 ? 128 : n === 2 ? 92 : n === 3 ? 64 : 46);
  const box = el("div", { class: "tzg" }, hanziEl(w.hz, w.py, "word"));
  box.firstChild.style.fontSize = "min(" + fs + "px, " + Math.round(fs / 3) + "vw)";

let ACTIVE_DECK = null;   // only the deck you used last answers the keyboard
// mode "due": today's reviews; "new": learn new words. onDone fires when the queue is empty.
function mountCards(root, mode, onDone) {
  root.replaceChildren();
  const S = Store.state, me = {};
  let queue = mode === "new" ? newCards(S.settings.newPerSession) : dueCards();
  let shown = false, done = 0;
  const history = [];     // what Previous steps back through: graded or skipped cards
  const total = queue.length;
  const head = el("div", { class: "split" });
  const stage = el("div", { class: "card-stage" });
  root.append(head, stage);
  ACTIVE_DECK = me;
  root.addEventListener("pointerdown", () => (ACTIVE_DECK = me));
  const keys = (e) => {
    if (!root.isConnected) return document.removeEventListener("keydown", keys);
    if (ACTIVE_DECK !== me || e.target.closest("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;

      el("p", { class: "label" }, mode === "new" ? "New words" : "Review"),
      el("p", { class: "muted small num" }, queue.length ? done + " done · " + queue.length + " left" : ""));
  }

    return el("div", { class: "card-nav" },
      el("button", { class: "btn", type: "button", onclick: back, disabled: !history.length, title: "Previous word (← key)" }, "‹ Back"),
      el("button", { class: "btn play", type: "button", onclick: () => Voice.word(queue[0]), title: "Hear it again (R key)" }, speakerIcon(), playLabel),
      el("button", { class: "btn", type: "button", onclick: skip, disabled: queue.length < 2, title: "Skip it for now (→ key)" }, "Skip ›"));
  }

    header();
    const msg = mode === "new"
      ? (total ? "You learned " + total + " new words. They come back for review tomorrow." : "No new words left in the list. Add your own on the Words tab.")
      : (total ? "Reviews done for today. " + done + " cards checked." : "Nothing to review right now. New words show up here the day after you learn them.");

    const w = queue[0];

    stage.replaceChildren(
      wordFace(w),
      el("p", { class: "muted small" }, "Say the pinyin and the meaning, then check"),
      nav("Play"),

      el("button", { class: "btn " + g.key, type: "button", onclick: () => grade(i) }, g.label, el("small", {}, ivlLabel(nextInterval(c, i))))));
    stage.replaceChildren(
      wordFace(w),
      el("div", { class: "answer" }, pinyinEl(w.py), el("p", { class: "meaning" }, w.en), w.stage ? null : el("span", { class: "chip" }, "Your word"),
        heard ? el("p", { class: "muted small" }, "Heard in: ", hanziEl(heard[0], heard[1]), " " + heard[1]) : null,
        c ? null : el("p", { class: "muted small" }, "New word: listen, say it out loud, then rate how well you know it")),

// ---------- words tab ----------

// ---------- tones: ear trainer, tone-pair cards, shadowing ----------
const MA = ["", "mā", "má", "mǎ", "mà", "ma"];
const TONE_NAME = ["", "1st", "2nd", "3rd", "4th", "neutral"];
const TONE_SHAPE = ["", "flat", "rising", "dipping", "falling", "light"];
// The classic "ma" set: one syllable, four tones, four different words.
const MA_WORD = ["", "妈 mom", "麻 hemp", "马 horse", "骂 scold"];
// Tone contour, drawn on the classic 5-level pitch scale.
const CONTOUR = { 1: [[0, 5], [1, 5]], 2: [[0, 3], [1, 5]], 3: [[0, 2], [0.45, 1], [1, 4]], 4: [[0, 5], [1, 1]], 5: [[0.4, 2.5], [0.6, 2.5]] };
function contourEl(tones) {
  const w = 60 * tones.length, svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " 46"); svg.setAttribute("class", "contour"); svg.setAttribute("aria-hidden", "true");
  svg.style.width = (tones.length * 44) + "px";
  tones.forEach((t, i) => {
    const p = document.createElementNS(svg.namespaceURI, "polyline");
    p.setAttribute("points", CONTOUR[t].map(([x, y]) => (i * 60 + 8 + x * 44) + "," + (44 - y * 8)).join(" "));
    p.setAttribute("fill", "none"); p.setAttribute("stroke", "var(--t" + t + ")"); p.setAttribute("stroke-width", "5"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
    svg.append(p);
  });
  return svg;
}
// Words whose written tones match what you hear: no neutral tone, no 一/不 changes, no 3+3, no erhua, no phrase recordings.
function tonePool(syllables) {
  const ok = (w) => w.tones.length === syllables && w.tones.every((t) => t >= 1 && t <= 4) && !/[一不儿]/.test(w.hz) && !(syllables === 2 && w.tones[0] === 3 && w.tones[1] === 3) && [...w.hz].length === syllables && !Voice.carrier(w);
  const mine = learned().filter(ok);
  return mine.length >= 12 ? mine : WORDS.filter((w) => w.stage && w.stage <= Math.max(1, currentStage()) && ok(w));
}
function segmented(options, value, onPick, label) {
  const group = el("div", { class: "seg-group", role: "group", "aria-label": label });
  const draw = (v) => group.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === String(v))));
  for (const [v, text] of options) group.append(el("button", { class: "seg", type: "button", "data-v": v, onclick: () => { draw(v); onPick(v); } }, text));
  draw(value);
  return group;
}

function mountToneTrainer(root) {
  root.replaceChildren();
  let syl = learned().length > 40 ? 2 : 1, word = null, answered = false, right = 0, asked = 0;
  const score = el("span", { class: "muted small num" }, "Hear a word, pick its tones");
  const play = el("button", { class: "play-big", type: "button", onclick: () => (word && !answered ? Voice.word(word) : round()) }, speakerIcon(), el("span", {}, "Start"));
  const choices = el("div", { class: "choices" });
  const out = el("div", { class: "result", role: "status" });
  root.append(
    el("div", { class: "panel-head" }, el("h3", {}, "Ear trainer"), score),
    segmented([[1, "One syllable"], [2, "Two syllables"]], syl, (v) => { syl = +v; if (word) round(); }, "Syllables"),
    el("div", { class: "trainer" }, choices, play, out));
  function round() {
    word = pick(tonePool(syl)); answered = false;
    out.replaceChildren();
    play.lastChild.textContent = "Play again";
    const key = word.tones.join("-");
    let opts = ["1", "2", "3", "4"];
    if (syl === 2) {
      const all = [];
      for (let a = 1; a <= 4; a++) for (let b = 1; b <= 4; b++) if (!(a === 3 && b === 3)) all.push(a + "-" + b);
      opts = shuffle([key, ...shuffle(all.filter((k) => k !== key)).slice(0, 3)]);
    }
    choices.replaceChildren(...opts.map((k) => {
      const ts = k.split("-").map(Number);
      return el("button", { class: "choice", type: "button", "data-key": k, onclick: (e) => answer(k, e.currentTarget) },
        contourEl(ts), el("span", { class: "choice-py" }, ts.map((t) => MA[t]).join(" ")),
        el("span", { class: "choice-num" }, ts.length === 1 ? TONE_NAME[ts[0]] + " tone · " + TONE_SHAPE[ts[0]] : ts.join(" + ")),
        el("span", { class: "choice-en" }, ts.length === 1 ? MA_WORD[ts[0]] : ts.map((t) => TONE_SHAPE[t]).join(" + ")));
    }));
    Voice.word(word);

    play.lastChild.textContent = "Next word";

      el("p", { class: "label" }, ok ? "Right" : "Not quite: it was " + word.tones.map((t) => TONE_NAME[t]).join(" + ")),
      el("div", { class: "result-word" }, hanziEl(word.hz, word.py, "han result-hz"), speakBtn(word, "Play")),
      pinyinEl(word.py), el("p", { class: "result-en" }, word.en)));
    score.textContent = right + " of " + asked + " right";
  }
}

const isoDay = (n) => { const d = dayDate(n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const randomToken = () => [...crypto.getRandomValues(new Uint8Array(24))].map((b) => b.toString(16).padStart(2, "0")).join("");
const Cloud = {
  ready: () => !!(window.MC_CLOUD && MC_CLOUD.url && MC_CLOUD.key),
  async rpc(fn, args, keepalive = false) {
    const r = await fetch(MC_CLOUD.url + "/rest/v1/rpc/" + fn, {
      method: "POST", keepalive,
      // A publishable key goes in apikey only; the Authorization header is for JWTs (the older anon key).
      headers: Object.assign({ "Content-Type": "application/json", apikey: MC_CLOUD.key }, MC_CLOUD.key.startsWith("eyJ") ? { Authorization: "Bearer " + MC_CLOUD.key } : {}),
      body: JSON.stringify(args),
    });
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!r.ok) throw Object.assign(new Error((data && data.message) || "The server answered " + r.status), { status: r.status });
    return data;
  },
  me: () => Store.state.share || null,          // { code, className, id, token, name, lastSync }
  // What the coach sees: totals and the last 14 days, never the cards themselves.
  summary() {
    const S = Store.state, t = dayNum(), days = [];
    for (let d = t - 13; d <= t; d++) {
      const a = S.activity[d] || {};
      days.push([S.sessions.filter((s) => s.d === d).reduce((m, s) => m + (s.min || 0), 0), (a.rev || 0) + (a.add || 0)]);
    }
    const tone = Object.values(S.toneStats).reduce((acc, v) => ({ n: acc.n + v.n, ok: acc.ok + v.ok }), { n: 0, ok: 0 });
    const active = Object.keys(S.activity).map(Number).concat(S.sessions.map((s) => s.d));
    return {
      v: 1, stage: currentStage(), learned: learned().length, known: known().length,
      sessions: S.sessions.filter((s) => s.plan !== "review").length, minutes: S.sessions.reduce((m, s) => m + (s.min || 0), 0),
      lastDay: active.length ? isoDay(Math.max(...active)) : null, today: isoDay(t), days,
      tone: tone.n ? Math.round((100 * tone.ok) / tone.n) : null,
    };
  },
  async className(code) { return this.rpc("mc_class_name", { p_code: code }); },
  async join(code, name) {
    const id = crypto.randomUUID(), token = randomToken();
    const res = await this.rpc("mc_join", { p_code: code, p_learner: id, p_token: token, p_name: name });
    Store.state.share = { code: code.trim().toUpperCase(), className: res && res.class, id, token, name, lastSync: 0 };
    Store.save();
    await this.sync(true);
  },
  // Throttled to once every 2 minutes unless forced (after a session, when the app is closed).
  async sync(force) {
    const me = this.me();
    if (!me || !this.ready() || (!force && Date.now() - (me.lastSync || 0) < 120000)) return;
    me.lastSync = Date.now();
    try {
      const ok = await this.rpc("mc_sync", { p_learner: me.id, p_token: me.token, p_summary: this.summary() }, true);
      if (ok === false) { me.removed = true; }
      Store.save();
    } catch { me.lastSync = 0; }
  },
  async leave() {
    const me = this.me();
    if (!me) return;
    try { await this.rpc("mc_leave", { p_learner: me.id, p_token: me.token }); } catch {}
    delete Store.state.share;
    Store.save();
  },
};

  [start, start + Math.floor(days / 2), t].forEach((d, i) => add("text", { x: x(d), y: H - 6, "text-anchor": ["start", "middle", "end"][i] }, fmtDay(d)));
  const line = pts.map(([d, v]) => x(d) + "," + y(v)).join(" ");
  add("polygon", { points: x(start) + "," + y(0) + " " + line + " " + x(t) + "," + y(0), fill: "var(--accent)", opacity: 0.12 });
  add("polyline", { points: line, fill: "none", stroke: "var(--accent)", "stroke-width": 2.5, "stroke-linejoin": "round" });
  add("circle", { cx: x(t), cy: y(pts[pts.length - 1][1]), r: 4.5, fill: "var(--accent)" });

}
function renderProgress(root) {
  root.replaceChildren();
  const S = Store.state, t = dayNum(), full = S.sessions.filter((s) => s.plan !== "review");
  const mins = S.sessions.reduce((a, s) => a + (s.min || 0), 0), nLearned = learned().length;
  const { pace, planned } = wordsPerDay();
  root.append(el("div", { class: "panel" }, el("h2", {}, "Progress"),
    el("div", { class: "stats" },
      el("div", { class: "stat" }, el("span", { class: "label" }, "Sessions"), el("b", {}, full.length)),
      el("div", { class: "stat" }, el("span", { class: "label" }, "Hours studied"), el("b", {}, (mins / 60).toFixed(1))),
      el("div", { class: "stat" }, el("span", { class: "label" }, "Words learned"), el("b", {}, nLearned)),
      el("div", { class: "stat" }, el("span", { class: "label" }, "Known well"), el("b", {}, known().length))),
    el("p", { class: "label" }, "Words learned, last 8 weeks"), wordsChart()));
  // last 4 weeks: one square per day
  const strip = el("div", { class: "strip", role: "img", "aria-label": "Study days in the last 4 weeks" });

  }

    el("div", { class: "legend muted" }, el("span", {}, el("span", { class: "day full" }), " session"), el("span", {}, el("span", { class: "day some" }), " review only"), el("span", {}, el("span", { class: "day" }), " rest"))));
  const ms = el("ol", { class: "milestones" }, MILESTONES.map((m) => {

    return el("li", {}, el("b", { class: "num" }, m.n + " words"), el("span", {}, m.can),
      left <= 0 ? el("span", { class: "chip good" }, "reached") : el("span", { class: "chip num" }, "≈ " + fmtDay(eta, { month: "short", day: "numeric", year: "numeric" })));
  }));
  root.append(el("div", { class: "panel" }, el("h3", {}, "Milestones"), ms,
    el("p", { class: "muted small" }, (planned ? "Estimated from your plan: " : "At your pace over the last 4 weeks: ") + pace.toFixed(1) + " new words a day. Stages 1–3 hold " + WORDS.filter((w) => w.stage).length + " words; past that, add words from your course on the Words tab.")));
  const weak = Object.entries(S.toneStats).filter(([k, v]) => k.includes("-") && v.n >= 3).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n).slice(0, 4);

    el("div", { class: "row" }, weak.map(([k, v]) => el("span", { class: "chip" + (v.ok / v.n < 0.6 ? " bad" : "") }, k.split("-").map((n) => MA[n]).join(" + ") + " · " + Math.round((100 * v.ok) / v.n) + "%")))));
  const per = el("select", { id: "set-new", onchange: (e) => { S.settings.newPerSession = +e.target.value; Store.save(); renderProgress(root); } },

  root.append(el("div", { class: "panel" }, el("h3", {}, "Settings"), el("label", { class: "field" }, el("span", { class: "label" }, "Pace"), per),
    el("p", { class: "muted small" }, "12 is a good default. If reviews take longer than 10 minutes, lower it for a week.")));

const VIEWS = {
  today: renderToday,
  cards: (r) => { r.replaceChildren(speedControl(null)); const p = el("div", { class: "panel" }), q = el("div", { class: "panel" }); r.append(p, q); mountCards(p, "due"); q.append(el("h3", {}, "Learn new words"), el("p", { class: "muted" }, "Normally part of each session. Start here if you want extra."), el("button", { class: "btn", type: "button", onclick: () => mountCards(q, "new") }, "Learn " + Store.state.settings.newPerSession + " new words")); },

  speak: (r) => { mountSpeak(r); r.prepend(speedControl(null)); },

let CURRENT = "today", JOIN_PANEL = null;
function show(name, keepHash) {

  CURRENT = name;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === name)));
  document.querySelectorAll(".view").forEach((v) => (v.hidden = v.id !== "view-" + name));
  if (typeof speechSynthesis !== "undefined") speechSynthesis.cancel();
  VIEWS[name]($("#view-" + name));
  if (JOIN_PANEL) $("#view-" + name).prepend(JOIN_PANEL);   // an open invite stays on top until answered
  document.dispatchEvent(new Event("mc:render"));
  try { localStorage.setItem("mandarin-coach-tab", name); } catch {}
}
function topStatus() {
  const n = learned().length, type = dayType();
  $("#top-status").textContent = "Stage " + currentStage() + " · " + n + (n === 1 ? " word · " : " words · ") + (RUN ? "session in progress" : type === "session" ? "session day" : type === "off" ? "off day: 10-minute review" : "done for today");
}
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { show(t.dataset.view); window.scrollTo({ top: 0 }); }));
document.addEventListener("mc:render", topStatus);

Voice.init();
// Browsers start audio only after a tap: unlock it on the first one and fetch this stage's recordings.
document.addEventListener("pointerdown", () => { Voice.audioCtx(); Voice.preload(currentStage()); }, { once: true, capture: true });
let first = "today";
try { first = /^#\w+$/.test(location.hash) && VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : RUN ? "today" : localStorage.getItem("mandarin-coach-tab") || "today"; } catch {}
Store.init();
setupInstall();
setupShare();
refreshCoachTab();
if (wantsCoach() && !RUN) first = "coach";
show(first);
// Opened from an invite link: ask first, then tidy the address so a reload doesn't ask again.
const joinCode = new URLSearchParams(location.search).get("join");
if (joinCode && Cloud.ready() && !(Cloud.me() && Cloud.me().code === joinCode.toUpperCase())) {
  JOIN_PANEL = joinPanel(joinCode, (joined) => {
    JOIN_PANEL = null;
    history.replaceState(null, "", location.pathname);
    show(CURRENT);
    if (joined) status("Joined. Your progress is shared with your coach.");
  });
  $("#view-" + CURRENT).prepend(JOIN_PANEL);
} else if (joinCode) history.replaceState(null, "", location.pathname);
